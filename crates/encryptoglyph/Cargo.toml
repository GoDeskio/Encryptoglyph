[package]
name = "encryptoglyph"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Encryptoglyph shared crypto core: versioned XChaCha20-Poly1305 envelope"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "getrandom/js"]

[dependencies]
rand_core = "0.6"
aes = "0.8"
ml-kem = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.2"
wasm-bindgen = { version = "0.2", optional = true }
fpe = "0.6.1"
blahaj = "0.7"
